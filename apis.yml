name: Omnidock
description: 'Omnidock is a merchant-of-record platform that streamlines multi-marketplace
  expansion for online sellers. The service lets merchants launch and sell products
  across multiple online marketplaces using pre-vetted seller accounts, while Omnidock
  acts as the merchant of record and handles the underlying transaction processing,
  payments, and compliance. The stated goal is to remove the operational complexity
  of expanding onto many marketplaces at once and make multi-marketplace selling
  effortless. Omnidock was surfaced as a portfolio company of HV Capital and added to
  the API Evangelist network; as of this enrichment pass it publishes only a marketing
  landing page and exposes no public API, developer documentation, or machine-readable
  surface.'
